name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.10', django: '4.2', drf: '3.15' }
          - { python: '3.12', django: '4.2', drf: '3.15' }
          - { python: '3.10', django: '5.2', drf: '3.16' }
          - { python: '3.13', django: '5.2', drf: '3.18' }
          - { python: '3.13', django: '6.0', drf: '3.18' }
          - { python: '3.14', django: '6.1', drf: '3.18' }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >
          uv run --python ${{ matrix.python }} --isolated
          --with 'django~=${{ matrix.django }}.0' --with 'djangorestframework~=${{ matrix.drf }}.0'
          pytest
